<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indian Bookstore</title>
</head>
<body style="font-family: Arial, sans-serif; padding: 20px; background: #f9f9f9;">
    <h1>Indian Bookstore Catalog</h1>
    <div style="display: flex; flex-wrap: wrap; gap: 20px;">
        {% for book in books %}
            <div style="background: white; border: 1px solid #ddd; border-radius: 8px; padding: 15px; width: 220px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
                {% if book.image %}
                    <img src="{{ book.image.url }}" alt="{{ book.title }}" style="width: 100%; height: 260px; object-fit: cover; border-radius: 4px;">
                {% endif %}
                <h3 style="margin: 10px 0 5px 0; font-size: 1.1rem;">{{ book.title }}</h3>
                <p style="margin: 2px 0; color: #555; font-size: 0.9rem;"><strong>Author:</strong> {{ book.author }}</p>
                <p style="margin: 2px 0; color: #555; font-size: 0.9rem;"><strong>Genre:</strong> {{ book.genre }}</p>
                <p style="margin: 5px 0; color: #2e7d32; font-weight: bold;">₹{{ book.price }}</p>
                <p style="font-size: 0.85rem; color: #666;">{{ book.description|truncatewords:15 }}</p>
            </div>
        {% empty %}
            <p>No books added to the catalog yet.</p>
        {% endfor %}
    </div>
</body>
</html>
